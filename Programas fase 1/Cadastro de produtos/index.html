<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <h1>Cadastro de produtos</h1>
    <form>
    <div class="div_id">
    <label for="id">ID</label><br>
    <input type="text" id="id" name="id">
    </div>

    <div class="div_descricao">
    <label for="descricao">Descrição</label><br>
    <input type="text" id="descricao" name="descricao" placeholder="Descrição do item">
    </div>

    <div class="div_ean">
    <label for="codigoBarras">EAN</label><br>
    <input type="text" id="codigoBarras" name="codigoBarras" placeholder="Codigo de barras" maxlength="13"
  pattern="\d{13}" inputmode="numeric">
    </div>

    <div class="div_categoria">
    <label for="categoria">Categoria</label><br>
    <select id="categoria" name="categoria">
        <option value="">Selecione uma categoria</option>
        <option value="congelados">Congelados</option>
        <option value="pereciveis">Pereciveis</option>
        <option value="hortifruti">Hortifruti</option>
        <option value="bazar">Bazar</option>
        <option value="mercearia">Mercearia</option>
    </select>
    </div>

    <div class="div_subcategoria">
    <label for="subcategoria">Subcategoria</label><br>
    <select id="subcategoria" name="subcategoria">
        <option value="">Selecione uma subcategoria</option>
    </select>
    </div>

    <div class="div_comprador">
    <label for="comprador">Comprador</label><br>
    <input type="text" id="comprador" name="comprador" readonly>
    </div>

    <div class="div_botao">
    <button type="submit">Salvar Produto</button>
    </div>
    </form>  
    <script src="app.js" defer></script>
</body>




















</html>
