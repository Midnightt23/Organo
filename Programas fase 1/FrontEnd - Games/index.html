<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MidnighTT Games</title>
        <link rel="stylesheet" href ="reset.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
        <link rel="stylesheet" href ="styles.css">
    </head>

    <body>
        <header class="cabeçalho">
            <div class="container">
                <input type="checkbox" id="menu" class="container__botao">
                <label for="menu">
            <span class="cabeçalho__menu-hamburguer container__imagem"></span>
                </label>
                <ul class="lista-menu">
                    <li class="lista-menu__itens"><a href="#" class="lista-menu__link">PS1</a> </li>
                    <li class="lista-menu__itens"><a href="#" class="lista-menu__link">PS2</a> </li>
                    <li class="lista-menu__itens"><a href="#" class="lista-menu__link">PS3</a> </li>
                    <li class="lista-menu__itens"><a href="#" class="lista-menu__link">PS4</a> </li>
                    <li class="lista-menu__itens"><a href="#" class="lista-menu__link">PS5</a> </li>                 
                </ul>
            <img src="img/Logo.svg" alt="Logo do MidnighTT Games" class="container__imagem">
            </div>
            <div class="container">
            <a href="#"><img src="img/Favoritos.svg" alt="Meus favoritos" class="container__imagem"></a>
            <a href="#"><img src="img/Compras.svg" alt="Carrinho de compras" class="container__imagem"></a>
            <a href="#"><img src="img/Usuario.svg" alt="Meu perfil" class="container__imagem"></a>
            </div>
          </header>
          <section class="open">
            <h2 class="open__titulo">MidnighTT Games</h2>
            <p class="open__texto">Os melhores jogos e os melhores preços você encontra aqui</p>
            <input type="search" class="open__pesquisa" placeholder="Procure seu jogo">
          </section>
          <section class="carrossel">
            <h3 class="carrossel__titulo">Promoções</h3>
            <!-- Slider main container -->
            <div class="swiper">

            <!-- If we need pagination -->
            <div class="swiper-pagination"></div>

            <!-- Additional required wrapper -->
            <div class="swiper-wrapper">
                <!-- Slides -->
                <div class="swiper-slide"><img src="img/granturismo7.jpg" alt="Gran Turismo 7"></div>
                <div class="swiper-slide"><img src="img/spiderman.jpg" alt="Spiderman"></div>
                <div class="swiper-slide"><img src="img/godfall.svg" alt="Godfall"></div>
                <div class="swiper-slide"><img src="img/nba.svg" alt="Nba"></div>
            </div>
    

            <!-- If we need navigation buttons -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

            </div>
          </section>

          <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
          <script>
            const swiper = new Swiper('.swiper', {
            spaceBetween: 10,
            slidesPerView: 3,
              pagination: {
             el: '.swiper-pagination',
            type: 'bullets',
             },
            });
          </script>
        
    </body>

</html>
